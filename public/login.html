<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StockPilot: a simple inventory management system for products, stock and categories.">
  <title>Login | StockPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark">SP</span>
        <h1>StockPilot</h1>
        <p class="muted">Inventory Management System</p>
      </div>

      <div class="alert alert-success" id="notice" role="status" hidden></div>
      <div class="alert alert-error" id="formError" role="alert" hidden></div>

      <h2 class="auth-title">Login to your account</h2>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username">
          <span class="error-text"></span>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password">
          <span class="error-text"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Log in</button>
      </form>

      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      <p class="demo-box">Demo accounts: <strong>admin@example.com</strong> / Admin@123 (admin) and <strong>staff@example.com</strong> / Staff@123 (staff)</p>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
